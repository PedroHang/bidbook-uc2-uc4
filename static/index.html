<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scope IQ — demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23186CAC'/%3E%3Ctext x='16' y='22' font-family='Helvetica' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3ESQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="hdr">
    <div class="hdr-brand">
      <span class="wordmark">Scope IQ</span>
      <span class="demo-tag">DEMO</span>
    </div>
    <nav class="hdr-tabs">
      <button id="tab-decision" class="tab" data-action="tab" data-tab="decision">Bid Decision</button>
      <button id="tab-scope" class="tab" data-action="tab" data-tab="scope">Scope Intelligence</button>
    </nav>
    <div class="hdr-right">
      <label class="persona-wrap" title="Acting as — audit entries carry this persona">
        <span class="persona-label">acting as</span>
        <select id="persona-select" data-select="persona" class="persona-select"></select>
      </label>
      <span class="proj-chip"><span class="dot"></span><span id="project-chip">loading…</span></span>
      <button class="gear" data-action="reset" title="Clear cached run, restore the seed scorecard, start live">&#9881;</button>
    </div>
  </header>

  <div class="pipeline">
    <span class="pipe-label">PIPELINE</span>
    <span class="pipe-chip">Document received</span>
    <span class="pipe-arrow">&#8594;</span>
    <button id="pipe-decision" class="pipe-chip pipe-decision" data-action="tab" data-tab="decision">Bid Decision</button>
    <span class="pipe-arrow">&#8594;</span>
    <button id="pipe-scope" class="pipe-chip" data-action="tab" data-tab="scope">Scope analysis</button>
    <span class="pipe-spacer"></span>
    <span class="pipe-note">Every figure below is computed in code from the extracted data, never by the model.</span>
  </div>

  <div id="view" class="view"></div>
  <div id="overlay"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
